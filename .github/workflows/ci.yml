name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  db-schema-test:
    name: Database schema + seed smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chessdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chessdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply schema
        env:
          PGPASSWORD: chess
        run: psql -h localhost -U chess -d chessdb -f db/01_schema.sql

      - name: Apply seed data
        env:
          PGPASSWORD: chess
        run: psql -h localhost -U chess -d chessdb -f db/02_seed.sql

      - name: Verify row counts
        env:
          PGPASSWORD: chess
        run: |
          set -e
          PLAYER_COUNT=$(psql -h localhost -U chess -d chessdb -tAc "SELECT COUNT(*) FROM player;")
          GAME_COUNT=$(psql -h localhost -U chess -d chessdb -tAc "SELECT COUNT(*) FROM game;")
          HISTORY_COUNT=$(psql -h localhost -U chess -d chessdb -tAc "SELECT COUNT(*) FROM rating_history;")

          echo "players=$PLAYER_COUNT games=$GAME_COUNT rating_history=$HISTORY_COUNT"
          [ "$PLAYER_COUNT" -eq 6 ]
          [ "$GAME_COUNT" -eq 6 ]
          [ "$HISTORY_COUNT" -eq 18 ]

      - name: Verify Elo symmetry (acceptance criterion)
        env:
          PGPASSWORD: chess
        run: |
          set -e
          psql -h localhost -U chess -d chessdb -tAc "
            SELECT bool_and(delta_sum = 0) FROM (
              SELECT rh1.player_id AS p1, rh2.player_id AS p2,
                     (rh1.elo - lag(rh1.elo) OVER (
                       PARTITION BY rh1.player_id ORDER BY rh1.valid_from
                     ))
                     +
                     (rh2.elo - lag(rh2.elo) OVER (
                       PARTITION BY rh2.player_id ORDER BY rh2.valid_from
                     )) AS delta_sum
              FROM rating_history rh1
              JOIN game g ON g.white_id = rh1.player_id
              JOIN rating_history rh2 ON rh2.player_id = g.black_id
              WHERE rh1.valid_from = (
                SELECT max(valid_from) FROM rating_history rh
                WHERE rh.player_id = rh1.player_id
              )
              AND rh2.valid_from = (
                SELECT max(valid_from) FROM rating_history rh
                WHERE rh.player_id = rh2.player_id
              )
            ) x
            WHERE delta_sum IS NOT NULL;
          "

  pytest:
    name: pytest (API endpoint tests)
    runs-on: ubuntu-latest
    needs: db-schema-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chessdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chessdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt

      - name: Run test suite
        working-directory: api
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chessdb
          POSTGRES_TEST_DB: chessdb_test
          TEST_API_KEY: test-key
        run: pytest tests -v

  compose-smoke:
    name: Docker Compose backend smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start PostgreSQL and API
        run: docker compose up -d --build

      - name: Verify API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api
          exit 1

      - name: Stop backend
        if: always()
        run: docker compose down -v

  package:
    name: Build Debian frontend package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb
        run: sh frontend/debian/build-deb.sh

      - name: Inspect package
        run: dpkg-deb --info frontend/debian/chess-club-manager_1.0.0_all.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: chess-club-manager-deb
          path: frontend/debian/chess-club-manager_1.0.0_all.deb

  docs:
    name: Build LaTeX documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-lang-german

      - name: Build all PDFs with Makefile
        run: make all

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdfs
          path: out/*.pdf

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Chess Club Manager ${{ github.ref_name }}" \
            --notes "Automatically built term-project documentation for ${{ github.ref_name }}." \
            out/*.pdf
